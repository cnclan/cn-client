<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CN CLIENT · 指挥网络终端</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0c0f0e;color:#d7e2dc;}
  body{font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    background-image:linear-gradient(rgba(157,255,200,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(157,255,200,.025) 1px,transparent 1px);background-size:44px 44px;}

  .device{position:relative;width:min(400px,92vw);opacity:0;background:#0e1211;border:1px solid #26332d;padding:26px 28px 18px;box-shadow:0 14px 40px rgba(0,0,0,.55);}
  .device.show{animation:cn-crt-on .7s ease forwards;}

  .head{display:flex;align-items:center;border-bottom:1px solid #26332d;padding-bottom:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-dot{width:7px;height:7px;background:#9dffc8;animation:cn-breathe 2.4s ease-in-out infinite;}
  .brand h1{margin:0;font-size:16px;font-weight:bold;letter-spacing:4px;color:#e8f2ec;}

  .tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid #26332d;margin:20px 0 16px;}
  .tab{border:0;background:transparent;color:#8fa39a;font-size:13px;letter-spacing:2px;padding:9px 0;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
  .tab+.tab{border-left:1px solid #26332d;}
  .tab.active{background:#9dffc8;color:#08120c;font-weight:bold;}

  .field{position:relative;margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:1px;color:#8fa39a;margin:0 0 5px;}
  .field input{width:100%;background:#0a0f0d;border:1px solid #1c2622;color:#d7e2dc;font-size:13px;padding:10px 12px;outline:none;transition:border-color .15s;font-family:inherit;}
  .field input:focus{border-color:#9dffc8;}
  .field input::placeholder{color:#4a5a52;}
  .row2{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:end;}
  .eye{height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #1c2622;background:#0a0f0d;color:#8fa39a;cursor:pointer;transition:.15s;}
  .eye:hover{color:#9dffc8;border-color:#9dffc8;}
  .eye svg{width:18px;height:18px;}

  .btn{position:relative;width:100%;margin-top:18px;padding:12px;border:1px solid #9dffc8;cursor:pointer;background:#9dffc8;color:#08120c;font-size:14px;font-weight:bold;letter-spacing:6px;transition:.15s;font-family:inherit;}
  .btn:hover{background:#0e1211;color:#9dffc8;}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.5;cursor:wait;}

  .err{color:#ff7d6b;font-size:13px;min-height:18px;margin-top:12px;text-align:center;letter-spacing:1px;}
  .err.shake{animation:cn-shake .3s;}
  .consent{display:flex;align-items:flex-start;gap:7px;margin-top:12px;font-size:12px;color:#8fa89a;line-height:1.6;letter-spacing:.5px;cursor:pointer;}
  .consent input{flex:none;margin-top:2px;accent-color:#9dffc8;}
  .consent a{color:#9dffc8;text-decoration:underline;}
  .consent a:hover{color:#c9ffdf;}
  .foot{margin-top:16px;padding-top:10px;border-top:1px solid #1c2622;text-align:center;font-size:11px;color:#5c6f66;letter-spacing:1px;}
  .hide{display:none;}

  #cn-boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9dffc8;font-family:Consolas,"Microsoft YaHei UI",monospace;letter-spacing:1px;}
  #cn-boot-init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.93);z-index:2;font-family:"Microsoft YaHei","微软雅黑",sans-serif;}
  #cn-boot-init span{border:1px solid #9dffc8;padding:12px 26px;font-size:15px;letter-spacing:3px;animation:cn-pulse 1s infinite;}
  #cn-boot-log{width:min(640px,88vw);font-size:15px;line-height:1.9;}
  #cn-boot-cursor{display:inline-block;width:10px;height:16px;vertical-align:bottom;background:#9dffc8;animation:cn-pulse .5s infinite;}

  @keyframes cn-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes cn-breathe{0%,100%{opacity:1;box-shadow:0 0 4px rgba(157,255,200,.7);}50%{opacity:.35;box-shadow:0 0 12px rgba(157,255,200,1);}}
  @keyframes cn-shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  @keyframes cn-crt-on{0%{opacity:0;transform:scaleY(.01) scaleX(.6);}55%{opacity:1;transform:scaleY(.01) scaleX(1);}100%{opacity:1;transform:scale(1);}}
  @keyframes cn-crt-off{0%{opacity:1;transform:scale(1);}40%{opacity:1;transform:scaleY(.01) scaleX(1);}100%{opacity:0;transform:scaleY(.01) scaleX(0);}}
  @media(max-width:520px){.device{padding:20px 16px 14px;}.brand h1{font-size:14px;}.btn{letter-spacing:3px;}}
/* combined page: neutralize the login-only body flex, move centering to the login screen */
body{display:block;}
#cn-login-screen{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#0c0f0e;
  background-image:linear-gradient(rgba(157,255,200,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(157,255,200,.025) 1px,transparent 1px);
  background-size:44px 44px;}
/* game page base (from fxclient static index head) */
html,body{overflow:hidden;padding:0;margin:0;background:rgb(0,0,0);color:rgb(255,255,255);}
/* tactical CRT treatment for the boot/load overlay */
#cn-boot{font-family:"Cascadia Mono","JetBrains Mono","Consolas","SF Mono","Roboto Mono",monospace;}
#cn-boot-log{text-shadow:0 0 8px rgba(157,255,200,.5),0 0 2px rgba(157,255,200,.9);}
#cn-boot::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 100%);}
#cn-boot::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px);}
#cn-boot .cn-crt{animation:cn-crt-flicker 4.5s infinite;}
@keyframes cn-crt-flicker{0%,100%{opacity:1;}96%{opacity:1;}97%{opacity:.86;}98%{opacity:.97;}99%{opacity:.93;}}
#cn-boot-init{font-family:"Cascadia Mono","JetBrains Mono",Consolas,monospace;}
#cn-boot-init span{text-shadow:0 0 10px rgba(157,255,200,.7),0 0 3px rgba(157,255,200,1);}
</style>

</div>
