<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CN CLIENT · 指挥网络终端</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0f16;color:#dce5ef;}
  body{font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    background-image:linear-gradient(rgba(143,240,187,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(143,240,187,.025) 1px,transparent 1px);background-size:44px 44px;}

  .device{position:relative;width:min(400px,92vw);opacity:0;background:#10161d;border:1px solid #2a3542;padding:26px 28px 18px;box-shadow:0 14px 40px rgba(0,0,0,.55);}
  .device.show{animation:cn-crt-on .7s ease forwards;}

  .head{display:flex;align-items:center;border-bottom:1px solid #2a3542;padding-bottom:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-dot{width:7px;height:7px;background:#8ff0bb;animation:cn-breathe 2.4s ease-in-out infinite;}
  .brand h1{margin:0;font-size:16px;font-weight:bold;letter-spacing:4px;color:#dce5ef;}

  .tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid #2a3542;margin:20px 0 16px;}
  .tab{border:0;background:transparent;color:#8b9bad;font-size:13px;letter-spacing:2px;padding:9px 0;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
  .tab+.tab{border-left:1px solid #2a3542;}
  .tab.active{background:#ffb84d;color:#0a1219;font-weight:bold;}

  .field{position:relative;margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:1px;color:#8b9bad;margin:0 0 5px;}
  .field input{width:100%;background:#0c1219;border:1px solid #1e2733;color:#dce5ef;font-size:13px;padding:10px 12px;outline:none;transition:border-color .15s;font-family:inherit;}
  .field input:focus{border-color:#7cc8ff;}
  .field input::placeholder{color:#5c6b7d;}
  .row2{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:end;}
  .eye{height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #1e2733;background:#0c1219;color:#8b9bad;cursor:pointer;transition:.15s;}
  .eye:hover{color:#7cc8ff;border-color:#7cc8ff;}
  .eye svg{width:18px;height:18px;}

  .btn{position:relative;width:100%;margin-top:18px;padding:12px;border:1px solid #8ff0bb;cursor:pointer;background:#8ff0bb;color:#0a1219;font-size:14px;font-weight:bold;letter-spacing:6px;transition:.15s;font-family:inherit;}
  .btn:hover{background:#10161d;color:#8ff0bb;}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.5;cursor:wait;}

  .err{color:#ff7d6b;font-size:13px;min-height:18px;margin-top:12px;text-align:center;letter-spacing:1px;}
  .err.shake{animation:cn-shake .3s;}
  .consent{display:flex;align-items:flex-start;gap:7px;margin-top:12px;font-size:12px;color:#8b9bad;line-height:1.6;letter-spacing:.5px;cursor:pointer;}
  .consent input{flex:none;margin-top:2px;accent-color:#8ff0bb;}
  .consent a{color:#7cc8ff;text-decoration:underline;}
  .consent a:hover{color:#a5dcff;}
  .foot{margin-top:16px;padding-top:10px;border-top:1px solid #1e2733;text-align:center;font-size:11px;color:#5c6b7d;letter-spacing:1px;}
  .hide{display:none;}

  #cn-boot{position:fixed;inset:0;z-index:9999;background:#080c12;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8ff0bb;font-family:Consolas,"Microsoft YaHei UI",monospace;letter-spacing:1px;}
  #cn-boot-init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.93);z-index:2;font-family:"Microsoft YaHei","微软雅黑",sans-serif;}
  #cn-boot-init span{border:1px solid #8ff0bb;padding:12px 26px;font-size:15px;letter-spacing:3px;animation:cn-pulse 1s infinite;}
  #cn-boot-log{width:min(640px,88vw);font-size:15px;line-height:1.9;}
  #cn-boot-cursor{display:inline-block;width:10px;height:16px;vertical-align:bottom;background:#8ff0bb;animation:cn-pulse .5s infinite;}

  @keyframes cn-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes cn-breathe{0%,100%{opacity:1;box-shadow:0 0 4px rgba(143,240,187,.7);}50%{opacity:.35;box-shadow:0 0 12px rgba(143,240,187,1);}}
  @keyframes cn-shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  @keyframes cn-crt-on{0%{opacity:0;transform:scaleY(.01) scaleX(.6);}55%{opacity:1;transform:scaleY(.01) scaleX(1);}100%{opacity:1;transform:scale(1);}}
  @keyframes cn-crt-off{0%{opacity:1;transform:scale(1);}40%{opacity:1;transform:scaleY(.01) scaleX(1);}100%{opacity:0;transform:scaleY(.01) scaleX(0);}}
  @media(max-width:520px){.device{padding:20px 16px 14px;}.brand h1{font-size:14px;}.btn{letter-spacing:3px;}}
/* combined page: neutralize the login-only body flex, move centering to the login screen */
body{display:block;}
#cn-login-screen{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#0a0f16;
  background-image:linear-gradient(rgba(143,240,187,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(143,240,187,.025) 1px,transparent 1px);
  background-size:44px 44px;}
/* public pages nav (S8): sits inside the login screen so it hides when the game takes over */
.cn-public-nav{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:5;}
.cn-public-nav a{color:#7cc8ff;text-decoration:none;font-size:12px;letter-spacing:2px;border:1px solid #1e2733;background:rgba(12,18,25,.85);padding:7px 16px;}
.cn-public-nav a:hover{color:#a5dcff;border-color:#7cc8ff;}
/* game page base (from fxclient static index head) */
html,body{overflow:hidden;padding:0;margin:0;background:rgb(0,0,0);color:rgb(255,255,255);}
/* tactical CRT treatment for the boot/load overlay */
#cn-boot{font-family:"Cascadia Mono","JetBrains Mono","Consolas","SF Mono","Roboto Mono",monospace;}
#cn-boot-log{text-shadow:0 0 8px rgba(143,240,187,.5),0 0 2px rgba(143,240,187,.9);}
#cn-boot::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.55) 100%);}
#cn-boot::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px);}
#cn-boot .cn-crt{animation:cn-crt-flicker 4.5s infinite;}
@keyframes cn-crt-flicker{0%,100%{opacity:1;}96%{opacity:1;}97%{opacity:.86;}98%{opacity:.97;}99%{opacity:.93;}}
#cn-boot-init{font-family:"Cascadia Mono","JetBrains Mono",Consolas,monospace;}
#cn-boot-init span{text-shadow:0 0 10px rgba(143,240,187,.7),0 0 3px rgba(143,240,187,1);}
</style>

<link rel="icon" href="favicon.ico">
</head>

<div id="cn-login-screen">
<div id="cn-boot" style="display:none">
  <div id="cn-boot-init"><span>[ 点击初始化系统 ]</span></div>
  <div id="cn-boot-log"></div>
</div>

<div class="device" id="device">
  <div class="head">
    <div class="brand"><span class="brand-dot"></span><h1>CN CLIENT</h1></div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-mode="login">登 录</button>
    <button type="button" class="tab" data-mode="register">注 册</button>
  </div>

  <form id="f" autocomplete="on">
    <div class="field"><label>账号</label><input id="username" placeholder="小写字母数字下划线，3-20 位" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required /></div>
    <div class="row2">
      <div class="field" style="margin:0"><label>密码</label><input id="password" type="password" placeholder="8 位以上，含字母和数字" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required /></div>
      <button type="button" class="eye" id="eye" title="显示密码" aria-label="显示或隐藏密码">
        <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eye-off" class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div id="reg-fields" class="hide">
      <div class="field"><label>确认密码</label><input id="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" /></div>
      <div class="field"><label>昵称</label><input id="nickname" placeholder="对外显示名称" autocomplete="nickname" /></div>
      <div class="field"><label>邀请码</label><input id="invite" placeholder="XX-XXXXXX" autocomplete="off" /></div>
    </div>
    <label class="consent"><input type="checkbox" id="consent" /> 我已阅读并同意 <a href="privacy_policy" target="_blank">《隐私政策》</a></label>
    <button type="submit" class="btn" id="btn">接 入</button>
    <div class="err" id="err"></div>
  </form>

  <div class="foot">© 2026 CN CLIENT</div>
</div>
<nav class="cn-public-nav" aria-label="公开页">
  <a href="replays.html">回放大厅</a>
  <a href="r.html">回放详情</a>
</nav>

    <span id="windowContainer">
        <div class="window flex-column settings" style="display:none">
            <h1>CN CLIENT SETTINGS</h1>

                <button onclick="__fx.settingsManager.resetAll()">重置设置</button>

        <div class="window scrollable selectable" id="donationhistory" style="display:none">

            <button onclick="document.getElementById('updateNotification').style.display = 'none'">忽略</button>
        </div>
